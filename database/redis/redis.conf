# configuracoes do redis
#  cache de sessão e alertas e notificações

# Memória máxima (ajuste conforme ambiente)
maxmemory 128mb
maxmemory-policy allkeys-lru

# Persistência leve — RDB snapshots
save 900 1
save 300 10
save 60 10000

# Log level
loglevel notice

# Desabilitar comandos perigosos em produção
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
