  # ─── Frontend ────────────────────────────────────────────────────

  frontend:
    build: ./frontend
    container_name: planly-frontend
    environment:
      # ATENÇÃO: Como o Frontend roda no navegador do cliente (fora da rede do Docker),
      # as URLs de API devem apontar para 'localhost' e não para o nome dos containers.
      VITE_USER_SERVICE_URL:         http://localhost:4001
      VITE_PLANNING_SERVICE_URL:     http://localhost:4002
      VITE_GAMIFICATION_SERVICE_URL: http://localhost:4003
      VITE_ANALYTICS_SERVICE_URL:    http://localhost:4004
    ports:
      - "3000:3000"
    volumes:
      # Espelhamento de arquivos para Desenvolvimento (Hot Reload). 
      # Qualquer alteração no código local reflete instantaneamente dentro do container.
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    depends_on:
      - user-service
      - planning-service
      #- gamification-service
      #- analytics-service
    networks: [planly-net]

# ─── Volumes e Redes ────────────────────────────────────────────────

volumes:
  # Declaração dos volumes nomeados gerenciados pelo Docker para persistência de dados do banco e cache
  postgres-data:
  redis-data:

networks:
  # Cria uma rede isolada do tipo bridge. Todos os containers nela conseguem se
  # comunicar usando o próprio nome do serviço como endereço IP (DNS interno do Docker).
  planly-net:
    driver: bridge