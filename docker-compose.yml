services:
  redis:
    image: redis:7-alpine
    container_name: planly-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./database/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks: [planly-net]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: planly-rabbitmq
    env_file: .env
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [planly-net]

  user-service:
    build: ./services/user-service
    container_name: planly-user-service
    environment:
      PORT: 4001
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4001:4001"
    networks: [planly-net]

  planning-service:
    build: ./services/planning-service
    container_name: planly-planning-service
    environment:
      PORT: 4002
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://user-service:4001
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
    ports:
      - "4002:4002"
    depends_on:
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started
    networks: [planly-net]

  gamification-service:
    build: ./services/gamification-service
    container_name: planly-gamification-service
    environment:
      PORT: 4003
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
    ports:
      - "4003:4003"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [planly-net]

  analytics-service:
    build: ./services/analytics-service
    container_name: planly-analytics-service
    environment:
      PORT: 4004
      JWT_SECRET: ${JWT_SECRET}
      PLANNING_SERVICE_URL: http://planning-service:4002
    ports:
      - "4004:4004"
    depends_on:
      - planning-service
    networks: [planly-net]

  frontend:
    build: ./frontend
    container_name: planly-frontend
    environment:
      VITE_USER_SERVICE_URL: http://localhost:4001
      VITE_PLANNING_SERVICE_URL: http://localhost:4002
      VITE_GAMIFICATION_SERVICE_URL: http://localhost:4003
      VITE_ANALYTICS_SERVICE_URL: http://localhost:4004
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    depends_on:
      - user-service
      - planning-service
      - gamification-service
      - analytics-service
    networks: [planly-net]

volumes:
  redis-data:

networks:
  planly-net:
    driver: bridge
